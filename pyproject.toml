[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impossible_mix"
version = "0.1.0"
description = "Mezclas sonoras imposibles: marco unificado de control material x interaccion x propiedades sobre encoder neural congelado"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
clap = ["laion-clap>=1.1"]
encodec = ["encodec>=0.1"]
fad = ["frechet-audio-distance>=0.1"]
diffusion = ["diffusers>=0.27", "transformers>=4.40"]
stats = ["statsmodels>=0.14", "pingouin>=0.5"]
notebooks = ["jupyter", "ipykernel", "ipywidgets"]
dev = ["ruff>=0.4", "pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["impossible_mix*"]
exclude = ["notebooks*", "scripts*", "data*", "outputs*", "results*"]

[tool.ruff]
line-length = 100
target-version = "py310"
